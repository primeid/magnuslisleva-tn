<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ email.subject }}</title>
  <style>
    /* Global Overrides */
    body {
      margin: 0;
      padding: 0;
      background-color: #edf2ee !important;
      color: #1a2b20 !important;
      font-family: Georgia, 'Times New Roman', serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
    }
    
    a {
      color: #2d7a52 !important;
      text-decoration: underline;
    }
    
    a:hover {
      color: #1b5a3a !important;
    }

    h1, h2, h3, h4 {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: normal;
      color: #1a2b20;
      margin-top: 1.5em;
      margin-bottom: 0.5em;
      line-height: 1.25;
    }
    
    h1 { font-size: 24px; border-bottom: 1px solid #cddad0; padding-bottom: 8px; }
    h2 { font-size: 20px; }
    h3 { font-size: 18px; }
    
    p, li {
      font-size: 16px;
      color: #1a2b20;
    }
    
    ul, ol {
      padding-left: 20px;
    }
    
    li {
      margin-bottom: 8px;
    }

    /* Monospace elements for botanical/technical branding */
    code {
      font-family: "IBM Plex Mono", Consolas, Monaco, "Courier New", monospace !important;
      font-size: 14px;
      background-color: #eef4f0;
      padding: 2px 6px;
      border: 1px solid #cddad0;
      border-radius: 3px;
      color: #2d7a52;
    }
    
    pre {
      background-color: #f6f9f7;
      border: 1px solid #cddad0;
      border-radius: 4px;
      padding: 16px;
      overflow-x: auto;
      margin: 20px 0;
    }
    
    pre code {
      background-color: transparent !important;
      border: none !important;
      padding: 0 !important;
      color: #1a2b20 !important;
      font-size: 13px !important;
    }
    
    blockquote {
      border-left: 3px solid #2d7a52;
      margin: 20px 0;
      padding-left: 16px;
      color: #5e7363;
      font-style: italic;
    }

    /* Layout structure */
    .outer-table {
      width: 100%;
      background-color: #edf2ee;
      padding: 40px 10px;
    }
    
    .inner-container {
      max-width: 600px;
      width: 100%;
      background-color: #f6f9f7;
      border: 1px solid #cddad0;
      border-radius: 6px;
      overflow: hidden;
    }
    
    .header-bar {
      background-color: #eef4f0;
      border-bottom: 1px solid #cddad0;
      padding: 15px 20px;
      font-family: "IBM Plex Mono", Consolas, Monaco, "Courier New", monospace;
      font-size: 13px;
      color: #5e7363;
    }

    .header-title {
      font-weight: bold;
      color: #2d7a52 !important;
      text-decoration: none !important;
    }

    .content-area {
      padding: 30px 25px;
    }
    
    .footer-bar {
      background-color: #eef4f0;
      border-top: 1px solid #cddad0;
      padding: 20px;
      font-family: "IBM Plex Mono", Consolas, Monaco, "Courier New", monospace;
      font-size: 12px;
      color: #5e7363;
      text-align: center;
    }
    
    .footer-links a {
      color: #5e7363 !important;
      text-decoration: none;
      margin: 0 8px;
    }
    
    .footer-links a:hover {
      color: #2d7a52 !important;
      text-decoration: underline;
    }
    
    .clock-meta {
      margin-top: 10px;
      font-size: 11px;
      color: #889e8e;
    }
  </style>
</head>
<body>
  <table class="outer-table" border="0" cellpadding="0" cellspacing="0" align="center">
    <tr>
      <td align="center">
        <!-- Container -->
        <table class="inner-container" border="0" cellpadding="0" cellspacing="0">
          <!-- Header -->
          <tr>
            <td class="header-bar">
              <table width="100%" border="0" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="left">
                    <a href="https://magnuslislevatn.com" class="header-title">magnuslislevatn.com</a>
                  </td>
                  <td align="right" style="font-size: 11px;">
                    {{ email.publish_date|date:"Y-m-d" }}
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          
          <!-- Content -->
          <tr>
            <td class="content-area">
              {{ content }}
            </td>
          </tr>
          
          <!-- Footer -->
          <tr>
            <td class="footer-bar">
              <div class="footer-links">
                <a href="{{ unsubscribe_url }}">Unsubscribe</a>
                &bull;
                <a href="https://magnuslislevatn.com" target="_blank">Website</a>
                &bull;
                <a href="https://github.com/primeid/magnuslisleva-tn" target="_blank">Source Code</a>
              </div>
              <div class="clock-meta">
                A botanical-technical publication of texts, creations, and digital work.
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
